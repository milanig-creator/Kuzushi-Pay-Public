services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: kuzushi
      POSTGRES_DB: kuzushi_pay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuzushi -d kuzushi_pay"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
